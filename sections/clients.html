<!-- Sections/clients.html -->
<div id="clients" class="section-content active">
    <div class="card-container">
        <div class="card">
            <div class="card-header">
                <h3>Clientes Activos</h3>
                <div class="card-icon clients">👥</div>
            </div>
            <div class="card-value" id="client-count">0</div>
            <div class="card-label">Total de clientes activos</div>
        </div>
        <!-- More cards can be added here and populated dynamically -->
    </div>

    <!-- Search and filters -->
    <div class="form-container">
        <div class="form-row">
            <div class="form-group">
                <input type="text" id="clientSearch" placeholder="Buscar cliente por nombre, email o teléfono...">
            </div>
            <div class="form-group">
                <select id="membershipFilter">
                    <option value="">Filtrar por membresía</option>
                    <!-- Options will be populated dynamically -->
                </select>
            </div>
            <div class="form-group">
                <select id="statusFilter">
                    <option value="">Filtrar por estado</option>
                    <option value="active">Activo</option>
                    <option value="inactive">Inactivo</option>
                    <option value="pending">Por vencer</option>
                </select>
            </div>
        </div>
    </div>

    <!-- Client table -->
    <div class="table-container">
        <div class="table-header">
            <h3>Lista de Clientes</h3>
            <button id="add-client-btn" class="btn btn-primary">Nuevo Cliente</button>
        </div>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Email</th>
                    <th>Teléfono</th>
                    <th>Membresía</th>
                    <th>Fecha de Inicio</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="clients-table-body">
                <!-- Client rows will be populated dynamically by scripts.js -->
            </tbody>
        </table>
    </div>

    <!-- Client charts -->
    <div class="chart-row">
        <div class="chart-col">
            <div class="chart-container">
                <h3>Distribución de Membresías</h3>
                <canvas id="membershipDistributionChart"></canvas>
            </div>
        </div>
        <div class="chart-col">
            <div class="chart-container">
                <h3>Nuevos Clientes por Mes</h3>
                <canvas id="newClientsChart"></canvas>
            </div>
        </div>
    </div>
</div>
