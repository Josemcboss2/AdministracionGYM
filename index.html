<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Web de Gimnasio</title>

        <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
        <script src="app.js" defer></script>
        <link rel="stylesheet" href="style.css">
    </head>

<body>
    <!-- Sidebar -->
    <div class="sidebar">
        <div class="sidebar-header">
            <h2>GymSystem</h2>
            <p>Gestión de gimnasio</p>
        </div>
        <ul>
            <li class="active" data-section="dashboard">
                <span class="sidebar-icon">📊</span>
                <span>Dashboard</span>
            </li>
            <li data-section="clients">
                <span class="sidebar-icon">👥</span>
                <span>Clientes</span>
            </li>
            <li data-section="memberships">
                <span class="sidebar-icon">🏆</span>
                <span>Membresías</span>
            </li>
            <li data-section="attendance">
                <span class="sidebar-icon">📋</span>
                <span>Asistencia</span>
            </li>
            <li data-section="payments">
                <span class="sidebar-icon">💰</span>
                <span>Pagos</span>
            </li>
            <li data-section="trainers">
                <span class="sidebar-icon">🏋️</span>
                <span>Entrenadores</span>
            </li>
            <li data-section="reports">
                <span class="sidebar-icon">📈</span>
                <span>Reportes</span>
            </li>
            <li data-section="settings">
                <span class="sidebar-icon">⚙️</span>
                <span>Configuración</span>
            </li>
        </ul>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <div class="header">
            <h1 id="page-title">Dashboard</h1>
            <div class="user-profile">
                <span>Administrador</span>
                <div class="user-avatar">A</div>
            </div>
        </div>

        <!-- Contenedor de alertas -->
        <div id="alert-container"></div>

        <!-- Contenedor de secciones -->
        <div id="section-container"></div>
    </div>

    <!-- Script para cargar secciones dinámicamente -->
    <script src="scripts.js"></script>

    <!-- Modals -->
    <div id="addClientModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Agregar Nuevo Cliente</h3>
                <span class="modal-close" onclick="closeModal('addClientModal')">&times;</span>
            </div>
            <div class="modal-body">
                <form id="addClientForm">
                    <div class="form-group">
                        <label for="clientName">Nombre completo *</label>
                        <input type="text" id="clientName" name="clientName" required>
                    </div>
                    <div class="form-group">
                        <label for="clientEmail">Email *</label>
                        <input type="email" id="clientEmail" name="clientEmail" required>
                    </div>
                    <div class="form-group">
                        <label for="clientPhone">Teléfono *</label>
                        <input type="tel" id="clientPhone" name="clientPhone" required>
                    </div>
                    <div class="form-group">
                        <label for="clientMembership">Membresía *</label>
                        <select id="clientMembership" name="clientMembership" required>
                            <!-- Options will be populated dynamically -->
                        </select>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal('addClientModal')">Cancelar</button>
                <button class="btn btn-primary" onclick="document.getElementById('addClientForm').dispatchEvent(new Event('submit', { cancelable: true }))">Guardar</button>
            </div>
        </div>
    </div>

    <div id="addMembershipModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Agregar Nueva Membresía</h3>
                <span class="modal-close" onclick="closeModal('addMembershipModal')">&times;</span>
            </div>
            <div class="modal-body">
                <form id="addMembershipForm">
                    <div class="form-group">
                        <label for="membershipName">Nombre *</label>
                        <input type="text" id="membershipName" name="membershipName" required>
                    </div>
                    <div class="form-group">
                        <label for="membershipDescription">Descripción *</label>
                        <textarea id="membershipDescription" name="membershipDescription" rows="3" required></textarea>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="membershipDuration">Duración (días) *</label>
                            <input type="number" id="membershipDuration" name="membershipDuration" min="1" required>
                        </div>
                        <div class="form-group">
                            <label for="membershipPrice">Precio *</label>
                            <input type="number" id="membershipPrice" name="membershipPrice" min="0" step="0.01" required>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal('addMembershipModal')">Cancelar</button>
                <button class="btn btn-primary" onclick="document.getElementById('addMembershipForm').dispatchEvent(new Event('submit', { cancelable: true }))">Guardar</button>
            </div>
        </div>
    </div>
    <div id="editClientModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Editar Cliente</h3>
                <span class="modal-close" onclick="closeModal('editClientModal')">&times;</span>
            </div>
            <div class="modal-body">
                <form id="editClientForm">
                    <input type="hidden" id="editClientId" name="editClientId">
                    <div class="form-group">
                        <label for="editClientName">Nombre completo *</label>
                        <input type="text" id="editClientName" name="editClientName" required>
                    </div>
                    <div class="form-group">
                        <label for="editClientEmail">Email *</label>
                        <input type="email" id="editClientEmail" name="editClientEmail" required>
                    </div>
                    <div class="form-group">
                        <label for="editClientPhone">Teléfono *</label>
                        <input type="tel" id="editClientPhone" name="editClientPhone" required>
                    </div>
                    <div class="form-group">
                        <label for="editClientMembership">Membresía *</label>
                        <select id="editClientMembership" name="editClientMembership" required>
                            <!-- Options will be populated dynamically -->
                        </select>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal('editClientModal')">Cancelar</button>
                <button class="btn btn-primary" onclick="document.getElementById('editClientForm').dispatchEvent(new Event('submit', { cancelable: true }))">Guardar Cambios</button>
            </div>
        </div>
    </div>
    <div id="editMembershipModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Editar Membresía</h3>
                <span class="modal-close" onclick="closeModal('editMembershipModal')">&times;</span>
            </div>
            <div class="modal-body">
                <form id="editMembershipForm">
                    <input type="hidden" id="editMembershipId" name="editMembershipId">
                    <div class="form-group">
                        <label for="editMembershipName">Nombre *</label>
                        <input type="text" id="editMembershipName" name="editMembershipName" required>
                    </div>
                    <div class="form-group">
                        <label for="editMembershipDescription">Descripción *</label>
                        <textarea id="editMembershipDescription" name="editMembershipDescription" rows="3" required></textarea>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="editMembershipDuration">Duración (días) *</label>
                            <input type="number" id="editMembershipDuration" name="editMembershipDuration" min="1" required>
                        </div>
                        <div class="form-group">
                            <label for="editMembershipPrice">Precio *</label>
                            <input type="number" id="editMembershipPrice" name="editMembershipPrice" min="0" step="0.01" required>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal('editMembershipModal')">Cancelar</button>
                <button class="btn btn-primary" onclick="document.getElementById('editMembershipForm').dispatchEvent(new Event('submit', { cancelable: true }))">Guardar Cambios</button>
            </div>
        </div>
    </div>

</body>
</html>
